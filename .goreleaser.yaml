version: 2

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - main: .
    binary: herald
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/nogo/herald/cmd.commit={{.ShortCommit}}
      - -X github.com/nogo/herald/cmd.tag={{.Tag}}
      - -X github.com/nogo/herald/cmd.date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: ['tar.gz']
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
