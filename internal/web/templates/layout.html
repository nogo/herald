{{define "head"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="30">
  <title>Service Status</title>
  <style>
    :root {
      --bg: #fff; --bg-alt: #f6f8fa; --border: #d0d7de;
      --text: #1f2328; --text-muted: #656d76;
      --running: #1a7f37; --degraded: #9a6700; --stopped: #656d76; --error: #cf222e;
      --max-width: 860px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --bg-alt: #161b22; --border: #30363d;
        --text: #e6edf3; --text-muted: #8b949e;
        --running: #3fb950; --degraded: #d29922; --stopped: #8b949e; --error: #f85149;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px; line-height: 1.5; color: var(--text); background: var(--bg); margin: 0;
    }
    header { background: var(--bg-alt); border-bottom: 1px solid var(--border); padding: 10px 0; }
    header .container { display: flex; align-items: center; gap: 12px; }
    .site-title { font-weight: 600; font-size: 16px; color: var(--text); }
    .auto-refresh { margin-left: auto; color: var(--text-muted); font-size: 12px; }
    .container { max-width: var(--max-width); margin: 0 auto; padding: 0 16px; }
    main.container { padding-top: 20px; padding-bottom: 20px; }
    footer { border-top: 1px solid var(--border); padding: 10px 0; color: var(--text-muted); font-size: 12px; }
    section { margin-bottom: 28px; }
    h2 { font-size: 16px; font-weight: 600; margin: 0 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    .dot.up { background: var(--running); }
    .dot.degraded { background: var(--degraded); }
    .dot.down { background: var(--error); }
    .overall {
      display: inline-block; padding: 8px 16px; border-radius: 6px;
      font-weight: 600; text-transform: capitalize; color: #fff;
    }
    .overall.operational { background: var(--running); }
    .overall.degraded { background: var(--degraded); }
    .overall.down { background: var(--error); }
    .overall.unknown { background: var(--stopped); }
    .services { list-style: none; padding: 0; margin: 0; }
    .services li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .service-name { flex: 1; }
    .service-state { text-transform: capitalize; color: var(--text-muted); }
    .empty { color: var(--text-muted); font-style: italic; }
  </style>
</head>
<body>
<header>
  <div class="container">
    <span class="site-title">Service Status</span>
    <span class="auto-refresh">Auto-refresh 30s</span>
  </div>
</header>
<main class="container">
{{end}}

{{define "foot"}}
</main>
<footer>
  <div class="container">
    <span>Last updated: {{.UpdatedAt.Format "2006-01-02 15:04:05 MST"}}</span>
  </div>
</footer>
</body>
</html>
{{end}}
