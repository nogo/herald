{{define "status"}}
{{template "head" .}}

<section>
  <div class="overall {{.Overall}}">{{.Overall}}</div>
</section>

<section>
  <h2>Services</h2>
  {{if .Services}}
  <ul class="services">
    {{range .Services}}
    <li>
      <span class="dot {{.State}}"></span>
      <span class="service-name">{{.Name}}</span>
      <span class="service-state">{{.State}}</span>
    </li>
    {{end}}
  </ul>
  {{else}}
  <p class="empty">No public services.</p>
  {{end}}
</section>

{{template "foot" .}}
{{end}}
